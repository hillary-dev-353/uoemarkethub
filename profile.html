<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="cover"></div>

    <div class="profile-container">

        <div class="profile-header">
            <img id="profilePic" class="profile-pic" src="https://via.placeholder.com/150">

            <!-- ONLY ONE INPUT -->
            <input type="file" id="profileImageInput" accept="image/*" hidden>

            <h2 id="profileName"></h2>
            <p id="profilePhone"></p>

            <div class="profile-buttons">
                <button onclick="goHome()">Home</button>
                <button onclick="changePhoto()">Change Photo</button>
                <button onclick="goToPost()">Post Item</button>
                <button onclick="logoutUser()">Logout</button>
            </div>
        </div>

        <h3>My Posts</h3>
        <div class="my-posts"></div>

    </div>

    <script type="module" src="profile.js"></script>

</body>
</html>
